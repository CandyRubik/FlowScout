<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Веб-чат с DeepSeek для AI Challenge 1"
    />
    <title>DeepSeek Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-card" aria-label="DeepSeek Chat">
        <header class="chat-header">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">✦</div>
            <div>
              <h1>DeepSeek Chat</h1>
              <p id="status" class="status" role="status">Проверяем соединение…</p>
            </div>
          </div>
          <button id="clear-button" class="button button-secondary" type="button">
            Очистить
          </button>
        </header>

        <div
          id="messages"
          class="messages"
          aria-live="polite"
          aria-label="Сообщения чата"
        ></div>

        <form id="chat-form" class="composer">
          <label class="sr-only" for="prompt">Сообщение</label>
          <textarea
            id="prompt"
            rows="1"
            placeholder="Напишите сообщение…"
            autocomplete="off"
            required
          ></textarea>
          <button id="send-button" class="button button-primary" type="submit">
            Отправить
          </button>
          <p class="composer-hint">Enter — отправить · Shift+Enter — новая строка</p>
        </form>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
